name: Import AniVortex V11 package

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-v11.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout V11
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download V11 ZIP
        env:
          ZIP_URL: 'https://sdmntprukwest.oaiusercontent.com/files/00000000-e210-8243-af3f-a7459bee06b2/raw?se=2026-09-24T16%3A50%3A25Z&sp=r&sv=2026-02-06&sr=b&scid=892aa52f-c598-5efe-b989-0de219d0c116&skoid=9b41a688-1b44-4731-856e-b0efcf3660ed&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-24T15%3A02%3A05Z&ske=2026-09-25T15%3A02%3A05Z&sks=b&skv=2026-02-06&sig=jUduh/n0wg8ycJygchJUsQg%2B2hOwn5v72dyt8AAh010%3D'
        run: |
          curl -fL "$ZIP_URL" -o /tmp/anivortex-v11.zip
          test "$(stat -c%s /tmp/anivortex-v11.zip)" -gt 30000000

      - name: Replace repository contents with V11 package
        run: |
          rm -rf /tmp/anivortex-v11
          mkdir -p /tmp/anivortex-v11
          unzip -q /tmp/anivortex-v11.zip -d /tmp/anivortex-v11
          SRC="/tmp/anivortex-v11/AniVortex_FINAL_OPTIMIZED_V11"
          test -f "$SRC/site/index.html"
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          rsync -a --exclude='.github/workflows/' "$SRC/" ./
          test -f site/index.html

      - name: Commit complete V11 except workflows
        run: |
          git config user.name "AniVortex Deploy Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Deploy complete AniVortex V11 package"
          git push origin HEAD:main
