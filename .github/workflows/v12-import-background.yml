name: Import V12 Background Asset

on:
  push:
    branches: ["v12-design-system"]
    paths:
      - ".github/workflows/v12-import-background.yml"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout V12
        uses: actions/checkout@v4
        with:
          ref: v12-design-system
          fetch-depth: 0

      - name: Download generated background
        env:
          BG_URL: 'https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-f0c0-8210-a19b-b7d918e1820e/raw?se=2026-09-25T16%3A39%3A13Z&sp=r&sv=2026-02-06&sr=b&scid=785b9f62-513e-5de3-96f5-c9d507b8852c&skoid=9b41a688-1b44-4731-856e-b0efcf3660ed&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-25T16%3A27%3A16Z&ske=2026-09-26T16%3A27%3A16Z&sks=b&skv=2026-02-06&sig=ImPO6xa9QbCzLEcURF4cnTBsen9dLEWAVI2jHJi/dkY%3D'
        run: |
          mkdir -p src/public/imgs/backgrounds
          curl -fL "$BG_URL" -o src/public/imgs/backgrounds/v12-emerald-leaf-background.png
          test "$(stat -c%s src/public/imgs/backgrounds/v12-emerald-leaf-background.png)" -gt 1000000
          file src/public/imgs/backgrounds/v12-emerald-leaf-background.png

      - name: Rebuild site
        run: python scripts/build.py

      - name: Commit background asset
        run: |
          git config user.name "AniVortex V12 Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/public/imgs/backgrounds/v12-emerald-leaf-background.png site/public/imgs/backgrounds/v12-emerald-leaf-background.png
          git commit -m "Add V12 emerald leaf background asset"
          git push origin HEAD:v12-design-system
