name: Verify AniVortex

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Install browsers for cross-browser checks
        run: python -m playwright install --with-deps chromium firefox webkit

      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli@0.15.x

      - name: Run the complete production gate
        run: python scripts/verify.py

      - name: Run cross-browser production smoke
        run: python scripts/cross_browser_smoke.py --site site --engines chromium firefox webkit --report audit/cross-browser-smoke.json

      - name: Run local live-style QA with zoom and mobile matrix
        shell: bash
        run: |
          python -m http.server 8000 --bind 127.0.0.1 --directory site >/tmp/anivortex-verify-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          sleep 2
          python scripts/live_site_qa.py \
            --url http://127.0.0.1:8000/ \
            --engines chromium firefox webkit \
            --report audit/live-local-qa.json \
            --screenshots audit/live-local-screenshots

      - name: Run Lighthouse CI audit
        run: lhci autorun --config=lighthouserc.json

      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anivortex-quality-reports
          path: |
            audit/cross-browser-smoke.json
            audit/browser-smoke.json
            audit/lighthouse/
            audit/live-local-qa.json
            audit/live-local-screenshots/
