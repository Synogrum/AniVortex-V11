name: V12 Remove Dead V CSS

on:
  push:
    branches: ["v12-design-system"]
    paths:
      - ".github/workflows/v12-prune-dead-css.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout V12
        uses: actions/checkout@v4
        with:
          ref: v12-design-system
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Remove dead selectors and rebuild
        run: |
          python scripts/prune_dead_css.py --apply --report audit/v12-dead-css-removed.tsv
          python scripts/build.py

      - name: Commit cleaned V12
        run: |
          git config user.name "AniVortex V12 Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/css site build-manifest.json audit/v12-dead-css-removed.tsv
          if git diff --cached --quiet; then
            echo "No dead CSS changes required"
            exit 0
          fi
          git commit -m "Clean obsolete V transition CSS"
          git push origin HEAD:v12-design-system
