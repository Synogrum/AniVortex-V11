name: Real Browser QA

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/real-browser-qa.yml"
      - "scripts/installed_browser_qa.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-browsers:
    name: Windows - ${{ matrix.browser }}
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, edge, firefox]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Selenium
        run: python -m pip install "selenium>=4.25,<5"

      - name: Start local production server
        shell: pwsh
        run: |
          $p = Start-Process python -ArgumentList "-m","http.server","8000","--directory","site" -PassThru
          $p.Id | Out-File -FilePath server.pid
          Start-Sleep -Seconds 2
          Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8000/ | Out-Null

      - name: Run branded browser QA
        shell: pwsh
        run: python scripts/installed_browser_qa.py --url http://127.0.0.1:8000/ --browser ${{ matrix.browser }} --soak-seconds 120 --report audit/real-browser-${{ matrix.browser }}.json --screenshots audit/real-browser-${{ matrix.browser }}-screenshots

      - name: Upload browser report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-browser-${{ matrix.browser }}
          path: |
            audit/real-browser-${{ matrix.browser }}.json
            audit/real-browser-${{ matrix.browser }}-screenshots/

  macos-safari:
    name: macOS - Safari
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Selenium
        run: python -m pip install "selenium>=4.25,<5"

      - name: Enable Safari WebDriver
        run: sudo safaridriver --enable

      - name: Start local production server
        run: |
          python -m http.server 8000 --directory site >/tmp/anivortex-http.log 2>&1 &
          echo $! > /tmp/anivortex-http.pid
          sleep 2
          curl -f http://127.0.0.1:8000/ >/dev/null

      - name: Run Safari QA
        run: python scripts/installed_browser_qa.py --url http://127.0.0.1:8000/ --browser safari --soak-seconds 120 --report audit/real-browser-safari.json --screenshots audit/real-browser-safari-screenshots

      - name: Upload Safari report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-browser-safari
          path: |
            audit/real-browser-safari.json
            audit/real-browser-safari-screenshots/
